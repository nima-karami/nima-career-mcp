id: timeplay-fullstack
company_id: timeplay
org: TimePlay
title: Full-Stack Developer
start: "2023-08"
end: "2024-08"
location: Toronto, Ontario, Canada
summary: >-
  Full-stack developer across the gaming platform's player-facing web clients, its Node
  and Go services, and the per-ship Docker stack the platform is released on.
tags: [full-stack, frontend, backend, gameplay, payments, design, release-engineering]

evidence:
  - id: tpf-e1
    text: >-
      Owned the Wheel of Fortune multi-package purchase flow in the player-facing SPA and
      built its phone-based puzzle-solve gameplay feature end to end (solve screen,
      submit / lock logic, real-time state events).
    tags: [frontend, gameplay, ownership]
  - id: tpf-e2
    text: >-
      Extended a Node.js / Express + MongoDB payments service, which charges and pays out
      passenger folios, from a single cruise line to three: partner-aware payment routing
      and payout outlets, partner-specific login and guest-lookup flows, a filterable
      transactions endpoint, and hardened guest-inquiry validation, all through SOAP
      integrations to the lines' financial systems. Adapted an existing service rather
      than building one, and owns keeping those integrations working as partners change
      them.
    tags: [backend, payments, node, integration, mongodb]
  - id: tpf-e3
    text: Wheel of Fortune reaches over 35,000 players per year.
    metrics:
      - label: players per year
        value: "35,000+"
    tags: [scale]
  - id: tpf-e4
    text: >-
      Led the design, front end and product of a live Deal or No Deal game: designed the
      whole flow in Figma, shipped the React / TypeScript controller as lead developer,
      and iterated with the product manager through playtests, pushing back on which flow
      read better and which drove better player incentives. A separate developer owned the
      backend. The mobile version increased players and gross revenue by 12%.
    metrics:
      - label: players and gross revenue
        value: "+12%"
    tags: [design, product, figma, frontend, gameplay, revenue]
  - id: tpf-e5
    text: >-
      Built the guest-matching step that decides whose folio gets charged: the cruise
      line's guest lookup returns everyone sharing a folio or a stateroom, so the person
      logging in is matched to the right guest record by a name-similarity check that
      tolerates a passenger logging in with or without a middle name, and punctuation such
      as hyphens. Nicknames are out of scope.
    tags: [backend, payments, identity, real-money]
  - id: tpf-e6
    text: >-
      Handled release engineering and partner configuration on the platform's per-ship
      Docker Compose stack: version-pinned and rolled forward 15+ containerized services
      through staging and production, and wired per-partner payment outlets, credentials
      and feature flags.
    tags: [release-engineering, docker, operations, configuration]

