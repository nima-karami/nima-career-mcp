# YOURS is closed. It is dated 2025 to 2026 everywhere, never "Present".
id: yours-founder
company_id: yours
org: YOURS
title: Founder
start: "2025-01"
end: "2026-03"
location: Toronto, Ontario, Canada
summary: >-
  Founded a browser-based custom-apparel design studio and print-on-demand storefront,
  built its client and its plugin architecture, and validated the problem and the
  positioning through two product iterations and two rounds of customer conversations.
  A closed chapter, not a running business.
tags: [founder, 0-to-1, full-stack, design-engineering, product, customer-research, ai]

evidence:
  - id: yrs-e1
    text: >-
      Founded YOURS and built its browser design studio: users design on a 2D canvas, see
      it composited live onto a 3D garment, and order through a print-on-demand storefront
      (React 19, TypeScript, Three.js / React Three Fiber, Konva, Stripe, Printful).
    tags: [founder, 0-to-1, full-stack, design-engineering]
  - id: yrs-e2
    text: >-
      Architected a real-time 2D-to-3D design pipeline that composites user canvas designs
      onto textured 3D garment models at up to 4K, client-side with no server round-trips
      during editing, a differentiated live-preview experience.
    tags: [graphics, three.js, performance, craft]
  - id: yrs-e3
    text: >-
      Ran 25+ customer conversations across two product iterations and two rounds of live
      demos, surfaced the segment split between creatives and non-creatives ("blank-canvas
      anxiety"), and narrowed the product to gift givers, the segment with the clearest
      pain and the least price sensitivity.
    metrics:
      - label: customer conversations
        value: "25+"
    tags: [product, customer-research, positioning]
  - id: yrs-e4
    text: >-
      Prototyped a conversational AI design concierge that extracts a structured design
      spec from natural dialogue and fans out to AI image generation, as the on-ramp for
      non-creative users. A prototype, not a finished feature.
    tags: [ai, product, design, prototype]
  - id: yrs-e5
    text: >-
      Wired a print-on-demand commerce path (Stripe payments, Printful fulfillment, GeoIP
      multi-currency pricing, live shipping quotes, print-file generation) to demonstrate
      the purchase experience rather than as a fully transacting checkout.
    tags: [ecommerce, integration, stripe]
  - id: yrs-e6
    text: >-
      Re-architected the product into a monorepo in four days (feature-sliced services, a
      versioned API, shared Zod schemas) and moved every third-party call server-side,
      removing vendor API keys from the browser bundle.
    tags: [architecture, monorepo, security, backend, typescript]

