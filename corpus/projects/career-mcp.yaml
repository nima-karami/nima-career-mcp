# Claim ceiling: "designed, deployed and instrumented", never "used". Nothing here claims
# traffic, an audience, or Python seniority: the true claim is that he shipped a real
# deployed Python service on the official SDK through an AI-native workflow.
id: career-mcp
name: Career MCP server + terminal portfolio
blurb: >-
  This server: a public Model Context Protocol server in Python on the official SDK
  (Fly.io, 11 read-only tools over a curated corpus) that grounds the chat on his
  terminal-style personal site. Public and MIT-licensed.
tags: [mcp, python, ai-native, open-source, design-engineering, verification]

evidence:
  - id: cm-e1
    text: >-
      Designed and deployed a public Model Context Protocol server in Python on the
      official SDK, 11 read-only tools over a curated corpus, running on Fly.io over
      Streamable HTTP, and consumed it from the site so the chat there is grounded in
      vetted data end to end.
    metrics:
      - label: read-only tools
        value: "11"
    tags: [mcp, python, ai-native, open-source]
  - id: cm-e2
    text: >-
      Hardened the intentionally public, unauthenticated endpoint after a security review:
      per-IP rate limiting keyed on the unforgeable client IP with idle-bucket eviction,
      a body-size cap enforced on the real request stream, and Origin and Host validation
      against DNS rebinding.
    tags: [security, backend, python]
  - id: cm-e3
    text: >-
      Made the anti-hallucination guarantee structural rather than prompt-based: a Pydantic
      chokepoint every tool reads through, integrity validation that fails the server at
      startup on a dangling reference, provenance ids attached to every assembled line, and
      property tests asserting that every emitted line exists in the corpus.
    tags: [verification, testing, ai-native, python, architecture]

bullets:
