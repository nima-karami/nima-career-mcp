bio: >-
  Senior full-stack engineer with 5+ years shipping production software for the web: React
  and TypeScript in front, Go, Node and Python behind. I do my best work with end-to-end
  ownership, from the customer problem through architecture, launch and operation.


  I trained and practised as an architect, and I produced the drawing sets and construction
  documents that construction software reads, so I know those documents from the side that
  makes them. That training is also where the working habit comes from: hold a messy,
  multi-dimensional problem until the one clear line appears.


  For the past year I have built mostly through coding agents. I architect the software, the
  workflow the agents run in, and the checks that gate their output, and I own the decision
  to ship. Every task in those workflows runs planning, implementation, QA and a
  retrospective, and I revise the workflow itself from what the retrospectives record.


  Design is where I started and it still shows in the work. Toronto, in person.

